<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Update Fee Payment</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8f9fa}</style></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SMS Admin Portal</a></div></nav><div class="container my-5"><div class="card shadow p-4"><h3 class="text-primary mb-4">Update Fee Payment</h3><form method="POST">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Student</label><select name="student" class="form-select">{% for student in students %}<option value="{{ student.id }}" {% if student.id == fee_payment.student.id %}selected{% endif %}>{{ student.roll_number }} - {{ student.first_name }} {{ student.last_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Fee Amount</label><input type="number" step="0.01" name="amount" class="form-control" value="{{ fee_payment.amount }}" required></div><div class="col-md-4"><label class="form-label">Payment Date</label><input type="date" name="payment_date" class="form-control" value="{{ fee_payment.payment_date|date:'Y-m-d' }}" required></div><div class="col-md-4"><label class="form-label">Payment Method</label><select name="payment_method" class="form-select"><option {% if fee_payment.payment_method == 'Cash' %}selected{% endif %}>Cash</option><option {% if fee_payment.payment_method == 'Online' %}selected{% endif %}>Online</option><option {% if fee_payment.payment_method == 'Cheque' %}selected{% endif %}>Cheque</option></select></div><div class="col-md-4"><label class="form-label">Status</label><select name="status" class="form-select"><option {% if fee_payment.status == 'Paid' %}selected{% endif %}>Paid</option><option {% if fee_payment.status == 'Pending' %}selected{% endif %}>Pending</option></select></div><div class="col-12"><button class="btn btn-primary px-4">Save Changes</button><a class="btn btn-secondary px-4" href="{% url 'view_fees' %}">Cancel</a></div></div></form></div></div></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --dark-blue: #0a2540;
            --light-bg: #f8f9fa;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SMS Admin Portal</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_student' %}">Add Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'view_students' %}">View Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'search_student' %}">Search Student</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-light btn-sm mt-1" href="{% url 'logout' %}" onclick="return confirmLogout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card shadow p-4">
            <div class="card-body">
                <h3 class="card-title text-primary mb-4">Update Student Record</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'update_student' student.id %}">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentId" class="form-label">Student ID (Read Only)</label>
                            <input type="text" class="form-control bg-light" id="studentId" value="{{ student.id }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="rollNumber" class="form-label">Roll Number</label>
                            <input type="text" class="form-control" id="rollNumber" name="roll_number" value="{{ student.roll_number }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" name="first_name" value="{{ student.first_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" name="last_name" value="{{ student.last_name }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob" value="{{ student.dob|date:'Y-m-d' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="">Select Department</option>
                                <option value="AI & Machine Learning" {% if student.department == 'AI & Machine Learning' %}selected{% endif %}>AI & Machine Learning</option>
                                <option value="Computer Engineering" {% if student.department == 'Computer Engineering' %}selected{% endif %}>Computer Engineering</option>
                                <option value="Electronics & Telecom" {% if student.department == 'Electronics & Telecom' %}selected{% endif %}>Electronics & Telecom</option>
                                <option value="Mechanical Engineering" {% if student.department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="year" class="form-label">Academic Year</label>
                            <select class="form-select" id="year" name="year" required>
                                <option value="">Select Year</option>
                                <option value="First Year" {% if student.year == 'First Year' %}selected{% endif %}>First Year</option>
                                <option value="Second Year" {% if student.year == 'Second Year' %}selected{% endif %}>Second Year</option>
                                <option value="Third Year" {% if student.year == 'Third Year' %}selected{% endif %}>Third Year</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="semester" class="form-label">Semester</label>
                            <select class="form-select" id="semester" name="semester" required>
                                <option value="">Select Semester</option>
                                <option value="Semester 1" {% if student.semester == 'Semester 1' %}selected{% endif %}>Semester 1</option>
                                <option value="Semester 2" {% if student.semester == 'Semester 2' %}selected{% endif %}>Semester 2</option>
                                <option value="Semester 3" {% if student.semester == 'Semester 3' %}selected{% endif %}>Semester 3</option>
                                <option value="Semester 4" {% if student.semester == 'Semester 4' %}selected{% endif %}>Semester 4</option>
                                <option value="Semester 5" {% if student.semester == 'Semester 5' %}selected{% endif %}>Semester 5</option>
                                <option value="Semester 6" {% if student.semester == 'Semester 6' %}selected{% endif %}>Semester 6</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="address" class="form-label">Residential Address</label>
                            <input type="text" class="form-control" id="address" name="address" value="{{ student.address }}" required>
                        </div>

                        <div class="col-md-12 mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                            <a href="{% url 'view_students' %}" class="btn btn-secondary px-4">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function confirmLogout() {
            return confirm("Are you sure you want to log out?");
        }
    </script>
</body>
</html>

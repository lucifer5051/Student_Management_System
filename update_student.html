<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - College Admin Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1035 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            sticky: top;
            z-index: 100;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .form-select option {
            background-color: #1e1b4b;
            color: #fff;
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-blue) 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar glass-nav navbar-expand-lg py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <i class="bi bi-shield-lock-fill text-purple fs-3" style="color: var(--accent-purple);"></i>
                <span>College Admin<span class="text-purple" style="color: var(--accent-purple);">Portal</span></span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'dashboard' %}"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'view_students' %}"><i class="bi bi-people me-1"></i> Back to Students</a></li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="{% url 'logout' %}" onclick="return confirmLogout()"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <div class="bento-card">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="p-3 bg-warning bg-opacity-20 text-warning rounded-4">
                    <i class="bi bi-pencil-square fs-2"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-1">Update Student Record</h3>
                    <p class="text-white-50 small mb-0">Editing details for: {{ student.first_name }} {{ student.last_name }} ({{ student.roll_number }})</p>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0 bg-opacity-20 text-white rounded-3 p-3 mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="roll_number" class="form-label text-white-50 small font-monospace">ROLL NUMBER</label>
                        <input type="text" class="form-control" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="first_name" class="form-label text-white-50 small font-monospace">FIRST NAME</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ student.first_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="form-label text-white-50 small font-monospace">LAST NAME</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ student.last_name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="gender" class="form-label text-white-50 small font-monospace">GENDER</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="dob" class="form-label text-white-50 small font-monospace">DATE OF BIRTH</label>
                        <input type="date" class="form-control" id="dob" name="dob" value="{{ student.dob|date:'Y-m-d' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label text-white-50 small font-monospace">DEPARTMENT</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="AI & Machine Learning" {% if student.department == 'AI & Machine Learning' %}selected{% endif %}>AI & Machine Learning</option>
                            <option value="Computer Engineering" {% if student.department == 'Computer Engineering' %}selected{% endif %}>Computer Engineering</option>
                            <option value="Electronics & Telecom" {% if student.department == 'Electronics & Telecom' %}selected{% endif %}>Electronics & Telecom</option>
                            <option value="Mechanical Engineering" {% if student.department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="year" class="form-label text-white-50 small font-monospace">ACADEMIC YEAR</label>
                        <select class="form-select" id="year" name="year" required>
                            <option value="First Year" {% if student.year == 'First Year' %}selected{% endif %}>First Year</option>
                            <option value="Second Year" {% if student.year == 'Second Year' %}selected{% endif %}>Second Year</option>
                            <option value="Third Year" {% if student.year == 'Third Year' %}selected{% endif %}>Third Year</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="semester" class="form-label text-white-50 small font-monospace">SEMESTER</label>
                        <select class="form-select" id="semester" name="semester" required>
                            <option value="Semester 1" {% if student.semester == 'Semester 1' %}selected{% endif %}>Semester 1</option>
                            <option value="Semester 2" {% if student.semester == 'Semester 2' %}selected{% endif %}>Semester 2</option>
                            <option value="Semester 3" {% if student.semester == 'Semester 3' %}selected{% endif %}>Semester 3</option>
                            <option value="Semester 4" {% if student.semester == 'Semester 4' %}selected{% endif %}>Semester 4</option>
                            <option value="Semester 5" {% if student.semester == 'Semester 5' %}selected{% endif %}>Semester 5</option>
                            <option value="Semester 6" {% if student.semester == 'Semester 6' %}selected{% endif %}>Semester 6</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label text-white-50 small font-monospace">PHONE NUMBER</label>
                        <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-white-50 small font-monospace">EMAIL ADDRESS</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                    </div>

                    <div class="col-md-12">
                        <label for="address" class="form-label text-white-50 small font-monospace">RESIDENTIAL ADDRESS</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ student.address }}</textarea>
                    </div>

                    <div class="col-md-12 mt-4 d-flex gap-3 justify-content-end">
                        <a href="{% url 'view_students' %}" class="btn btn-outline-light rounded-pill px-4 border-opacity-20">Cancel</a>
                        <button type="submit" class="btn btn-gradient px-4"><i class="bi bi-check-circle me-1"></i> Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function confirmLogout() {
            return confirm("Are you sure you want to log out?");
        }
    </script>
</body>
</html>

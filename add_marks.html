<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Marks - College Admin Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1035 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            sticky: top;
            z-index: 100;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .form-select option {
            background-color: #1e1b4b;
            color: #fff;
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-blue) 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar glass-nav navbar-expand-lg py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <i class="bi bi-shield-lock-fill text-purple fs-3" style="color: var(--accent-purple);"></i>
                <span>College Admin<span class="text-purple" style="color: var(--accent-purple);">Portal</span></span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'dashboard' %}"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="{% url 'logout' %}" onclick="return confirmLogout()"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div class="bento-card">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="p-3 bg-purple bg-opacity-20 text-purple rounded-4" style="background: rgba(168, 85, 247, 0.15); color: var(--accent-purple);">
                    <i class="bi bi-journal-plus fs-2"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-1">Add Student Academic Marks</h3>
                    <p class="text-white-50 small mb-0">Record exam marks for a student</p>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success border-0 bg-success bg-opacity-20 text-white rounded-3 p-3 mb-4">
                        <i class="bi bi-check-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="student" class="form-label text-white-50 small font-monospace">SELECT STUDENT</label>
                        <select name="student" id="student" class="form-select" required>
                            <option value="">Choose Student...</option>
                            {% for student in students %}
                                <option value="{{ student.id }}">{{ student.roll_number }} - {{ student.first_name }} {{ student.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="subject" class="form-label text-white-50 small font-monospace">SUBJECT NAME</label>
                        <input type="text" name="subject" id="subject" class="form-control" placeholder="e.g. Machine Learning" required>
                    </div>

                    <div class="col-md-6">
                        <label for="marks_obtained" class="form-label text-white-50 small font-monospace">MARKS OBTAINED</label>
                        <input type="number" name="marks_obtained" id="marks_obtained" class="form-control" placeholder="e.g. 85" required>
                    </div>
                    <div class="col-md-6">
                        <label for="total_marks" class="form-label text-white-50 small font-monospace">TOTAL MARKS</label>
                        <input type="number" name="total_marks" id="total_marks" class="form-control" placeholder="e.g. 100" required>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-3 justify-content-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-light rounded-pill px-4 border-opacity-20">Cancel</a>
                        <button type="submit" class="btn btn-gradient px-4"><i class="bi bi-check-circle me-1"></i> Save Marks Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function confirmLogout() {
            return confirm("Are you sure you want to log out?");
        }
    </script>
</body>
</html>

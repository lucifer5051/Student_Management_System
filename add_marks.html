<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Marks</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8f9fa}</style></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SMS Admin Portal</a></div></nav><div class="container my-5"><div class="card shadow p-4"><h3 class="text-primary mb-4">Add Student Marks</h3>{% if messages %}{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% endif %}<form method="POST">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Student</label><select name="student" class="form-select" required><option value="">Select Student</option>{% for student in students %}<option value="{{ student.id }}">{{ student.roll_number }} - {{ student.first_name }} {{ student.last_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Subject</label><input type="text" name="subject" class="form-control" required></div><div class="col-md-6"><label class="form-label">Marks Obtained</label><input type="number" name="marks_obtained" class="form-control" required></div><div class="col-md-6"><label class="form-label">Total Marks</label><input type="number" name="total_marks" class="form-control" required></div><div class="col-12"><button class="btn btn-success">Save Marks</button></div></div></form></div></div></body></html>

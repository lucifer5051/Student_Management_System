<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Fees - Student Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pay-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 40px;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #10b981;
            color: #fff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .form-select option {
            background-color: #1e1b4b;
            color: #fff;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="pay-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 bg-success bg-opacity-20 text-success rounded-4 mb-3" style="border: 1px solid rgba(16, 185, 129, 0.3);">
                <i class="bi bi-credit-card-fill fs-1"></i>
            </div>
            <h3 class="fw-bold mb-1">Make Fee Payment</h3>
            <p class="text-white-50 small">Student: {{ student.first_name }} {{ student.last_name }} ({{ student.roll_number }})</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0 bg-opacity-20 text-white rounded-3 p-3 mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'student_pay_fee' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="amount" class="form-label text-white-50 small font-monospace">PAYMENT AMOUNT (₹)</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-white-50">₹</span>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="payment_method" class="form-label text-white-50 small font-monospace">PAYMENT METHOD</label>
                <select class="form-select" id="payment_method" name="payment_method" required>
                    <option value="">Select Payment Method</option>
                    <option value="Online / UPI">Online / UPI</option>
                    <option value="Credit / Debit Card">Credit / Debit Card</option>
                    <option value="Net Banking">Net Banking</option>
                    <option value="Cash">Cash</option>
                </select>
            </div>

            <button type="submit" class="btn btn-gradient w-100 mb-3"><i class="bi bi-shield-check me-2"></i>Pay Now</button>
            <a href="{% url 'student_dashboard' %}" class="btn btn-outline-light w-100 border-opacity-20 text-white-50" style="border-radius: 12px;">Cancel</a>
        </form>
    </div>

</body>
</html>

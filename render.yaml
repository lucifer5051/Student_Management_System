services:
  - type: web
    name: college-portal
    env: python
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn student_management.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-portal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12

databases:
  - name: college-portal-db
    plan: free

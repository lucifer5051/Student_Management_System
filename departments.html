<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Departments</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8f9fa}</style></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SMS Admin Portal</a><a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">Dashboard</a></div></nav><div class="container my-5"><h3 class="text-primary mb-4">Departments and Academic Years</h3><div class="row">{% for department in departments %}<div class="col-md-4 mb-3"><div class="card shadow h-100"><div class="card-body"><h5 class="text-primary">{{ department.department }}</h5><p class="text-muted mb-0">Available Years: First Year, Second Year, Third Year</p></div></div></div>{% empty %}<p class="text-muted">No departments found. Add students to display departments.</p>{% endfor %}</div></div></body></html>

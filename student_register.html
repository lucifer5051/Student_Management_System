<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - SMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 0;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .form-select option {
            background-color: #1e1b4b;
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div class="register-card">
            <div class="d-flex align-items-center mb-4">
                <div class="me-3 p-3 bg-purple rounded-4 bg-opacity-20 text-purple" style="background: rgba(168, 85, 247, 0.2);">
                    <i class="bi bi-person-plus-fill fs-2 text-warning"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">New Student Registration</h3>
                    <p class="text-white-50 mb-0">Create your student account to access the dashboard</p>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0 bg-opacity-20 text-white rounded-3 p-3 mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'student_register' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="roll_number" class="form-label text-white-50 small font-monospace">ROLL NUMBER (USERNAME)</label>
                        <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="e.g. AIML001" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label text-white-50 small font-monospace">PASSWORD</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Set a password" required>
                    </div>

                    <div class="col-md-6">
                        <label for="first_name" class="form-label text-white-50 small font-monospace">FIRST NAME</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Enter first name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="form-label text-white-50 small font-monospace">LAST NAME</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Enter last name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="profile_image" class="form-label text-white-50 small font-monospace">PROFILE PICTURE</label>
                        <input type="file" class="form-control" id="profile_image" name="profile_image" accept="image/*">
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label text-white-50 small font-monospace">GENDER</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="dob" class="form-label text-white-50 small font-monospace">DATE OF BIRTH</label>
                        <input type="date" class="form-control" id="dob" name="dob" required>
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label text-white-50 small font-monospace">DEPARTMENT</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="AI & Machine Learning">AI & Machine Learning</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Electronics & Telecom">Electronics & Telecom</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="year" class="form-label text-white-50 small font-monospace">ACADEMIC YEAR</label>
                        <select class="form-select" id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="First Year">First Year</option>
                            <option value="Second Year">Second Year</option>
                            <option value="Third Year">Third Year</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="semester" class="form-label text-white-50 small font-monospace">SEMESTER</label>
                        <select class="form-select" id="semester" name="semester" required>
                            <option value="">Select Semester</option>
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                            <option value="Semester 3">Semester 3</option>
                            <option value="Semester 4">Semester 4</option>
                            <option value="Semester 5">Semester 5</option>
                            <option value="Semester 6">Semester 6</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label text-white-50 small font-monospace">PHONE NUMBER</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="10 digit phone number" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-white-50 small font-monospace">EMAIL ADDRESS</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="example@domain.com" required>
                    </div>

                    <div class="col-md-12">
                        <label for="address" class="form-label text-white-50 small font-monospace">RESIDENTIAL ADDRESS</label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter full address" required></textarea>
                    </div>

                    <div class="col-md-12 mt-4 d-flex justify-content-between align-items-center">
                        <a href="{% url 'student_login' %}" class="text-white-50 text-decoration-none">&larr; Back to Login</a>
                        <button type="submit" class="btn btn-gradient px-5">Complete Registration</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>
</html>

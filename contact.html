<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - College Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1035 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            sticky: top;
            z-index: 100;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar glass-nav navbar-expand-lg py-3 mb-4">
        <div class="container px-4">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{% url 'login' %}">
                <i class="bi bi-mortarboard-fill text-warning fs-3"></i>
                <span>College<span class="text-purple" style="color: var(--accent-purple);">Portal</span></span>
            </a>
            <div class="ms-auto">
                <a href="{% url 'login' %}" class="btn px-4 rounded-pill text-white text-decoration-none fw-semibold" style="background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));">Login</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="bento-card text-center">
            <div class="d-inline-flex p-3 bg-purple bg-opacity-20 text-purple rounded-4 mb-3" style="background: rgba(168, 85, 247, 0.15); color: var(--accent-purple);">
                <i class="bi bi-headset fs-1"></i>
            </div>
            <h3 class="fw-bold mb-2">College Administration & Technical Support</h3>
            <p class="text-white-50 small mb-4">For assistance regarding student credentials, password resets, or fee discrepancies</p>

            <div class="bg-white bg-opacity-10 p-4 rounded-4 border border-white border-opacity-10 text-start">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <i class="bi bi-geo-alt-fill text-purple fs-4" style="color: var(--accent-purple);"></i>
                    <div>
                        <strong class="text-white d-block">Campus Address</strong>
                        <span class="text-white-50 small">College Administration Building, Tech Campus Road</span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 mb-3">
                    <i class="bi bi-envelope-fill text-info fs-4"></i>
                    <div>
                        <strong class="text-white d-block">Email Support</strong>
                        <span class="text-white-50 small">admin@collegeportal.edu</span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-telephone-fill text-success fs-4"></i>
                    <div>
                        <strong class="text-white d-block">Helpline Phone</strong>
                        <span class="text-white-50 small">+91 (020) 1234-5678</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

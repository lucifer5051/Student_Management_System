<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
        }
        .nav-pills {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-pills .nav-link {
            color: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            font-weight: 600;
            padding: 10px;
            transition: all 0.3s ease;
        }
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
        .portal-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .portal-icon {
            width: 60px;
            height: 60px;
            background: rgba(168, 85, 247, 0.15);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="portal-header">
            <div class="portal-icon">
                <i class="bi bi-mortarboard-fill fs-2 text-warning"></i>
            </div>
            <h3 class="fw-bold mb-1">College Portal</h3>
            <p class="text-white-50 small mb-0">Unified Login for Admins & Students</p>
        </div>

        {% if error_msg %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-20 text-white rounded-3 p-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error_msg }}
        </div>
        {% endif %}

        <!-- Role Selector Tabs -->
        <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">
                    <i class="bi bi-shield-lock me-1"></i> Admin Login
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">
                    <i class="bi bi-person-badge me-1"></i> Student Login
                </button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabsContent">
            
            <!-- Admin Login Form -->
            <div class="tab-pane fade show active" id="admin-login" role="tabpanel">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="admin_username" class="form-label text-white-50 small font-monospace">ADMIN USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="admin_username" name="username" placeholder="Enter admin username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="admin_password" class="form-label text-white-50 small font-monospace">ADMIN PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="admin_password" name="password" placeholder="Enter admin password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In as Admin</button>
                </form>
            </div>

            <!-- Student Login Form -->
            <div class="tab-pane fade" id="student-login" role="tabpanel">
                <form method="POST" action="{% url 'student_login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="student_roll" class="form-label text-white-50 small font-monospace">ROLL NUMBER / USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control" id="student_roll" name="roll_number" placeholder="e.g. AIML001" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="student_password" class="form-label text-white-50 small font-monospace">STUDENT PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="student_password" name="password" placeholder="Enter student password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In as Student</button>
                </form>
            </div>

        </div>

        <div class="text-center pt-3 border-top border-white-50 border-opacity-10">
            <span class="text-white-50 small">New Student? </span>
            <a href="{% url 'student_register' %}" class="text-info text-decoration-none fw-semibold">Register Account &rarr;</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

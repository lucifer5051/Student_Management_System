<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - SMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            color: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
        .portal-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.2));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="portal-icon">
            <i class="bi bi-mortarboard-fill fs-2 text-warning"></i>
        </div>
        <h3 class="text-center fw-bold mb-1">Student Portal</h3>
        <p class="text-center text-white-50 small mb-4">Sign in to access your dashboard</p>

        {% if error_msg %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger-emphasis rounded-3 p-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'student_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="roll_number" class="form-label text-white-50 small font-monospace">ROLL NUMBER / USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="e.g. AIML001" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-white-50 small font-monospace">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-white-50"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-gradient w-100 mb-3">Sign In to Student Portal</button>
        </form>

        <div class="text-center pt-3 border-top border-white-50 border-opacity-10">
            <p class="text-white-50 small mb-1">Don't have an account?</p>
            <a href="{% url 'student_register' %}" class="text-info text-decoration-none fw-semibold">Register New Student &rarr;</a>
            <div class="mt-3">
                <a href="{% url 'login' %}" class="text-white-50 text-decoration-none small"><i class="bi bi-shield-lock me-1"></i> Admin Portal Login</a>
            </div>
        </div>
    </div>

</body>
</html>

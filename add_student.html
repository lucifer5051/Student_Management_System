<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - College Admin Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1035 100%);
            min-height: 100vh;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            sticky: top;
            z-index: 100;
        }

        .bento-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .form-select option {
            background-color: #1e1b4b;
            color: #fff;
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-blue) 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar glass-nav navbar-expand-lg py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <i class="bi bi-shield-lock-fill text-purple fs-3" style="color: var(--accent-purple);"></i>
                <span>College Admin<span class="text-purple" style="color: var(--accent-purple);">Portal</span></span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'dashboard' %}"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="{% url 'add_student' %}"><i class="bi bi-person-plus me-1"></i> Add Student</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'view_students' %}"><i class="bi bi-people me-1"></i> View Students</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="{% url 'search_student' %}"><i class="bi bi-search me-1"></i> Search</a></li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-danger btn-sm rounded-pill px-3" href="{% url 'logout' %}" onclick="return confirmLogout()"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <div class="bento-card">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="p-3 bg-purple bg-opacity-20 text-purple rounded-4" style="background: rgba(168, 85, 247, 0.15); color: var(--accent-purple);">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-1">Add New Student Record</h3>
                    <p class="text-white-50 small mb-0">Register a student and assign initial login credentials</p>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0 bg-opacity-20 text-white rounded-3 p-3 mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'add_student' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="rollNumber" class="form-label text-white-50 small font-monospace">ROLL NUMBER (USERNAME)</label>
                        <input type="text" class="form-control" id="rollNumber" name="roll_number" placeholder="e.g. AIML005" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label text-white-50 small font-monospace">PASSWORD (PORTAL ACCESS)</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter student password" required>
                    </div>

                    <div class="col-md-6">
                        <label for="firstName" class="form-label text-white-50 small font-monospace">FIRST NAME</label>
                        <input type="text" class="form-control" id="firstName" name="first_name" placeholder="Enter first name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label text-white-50 small font-monospace">LAST NAME</label>
                        <input type="text" class="form-control" id="lastName" name="last_name" placeholder="Enter last name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="profile_image" class="form-label text-white-50 small font-monospace">PROFILE PICTURE</label>
                        <input type="file" class="form-control" id="profile_image" name="profile_image" accept="image/*">
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label text-white-50 small font-monospace">GENDER</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="dob" class="form-label text-white-50 small font-monospace">DATE OF BIRTH</label>
                        <input type="date" class="form-control" id="dob" name="dob" required>
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label text-white-50 small font-monospace">DEPARTMENT</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="AI & Machine Learning">AI & Machine Learning</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Electronics & Telecom">Electronics & Telecom</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="year" class="form-label text-white-50 small font-monospace">ACADEMIC YEAR</label>
                        <select class="form-select" id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="First Year">First Year</option>
                            <option value="Second Year">Second Year</option>
                            <option value="Third Year">Third Year</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="semester" class="form-label text-white-50 small font-monospace">SEMESTER</label>
                        <select class="form-select" id="semester" name="semester" required>
                            <option value="">Select Semester</option>
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                            <option value="Semester 3">Semester 3</option>
                            <option value="Semester 4">Semester 4</option>
                            <option value="Semester 5">Semester 5</option>
                            <option value="Semester 6">Semester 6</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label text-white-50 small font-monospace">PHONE NUMBER</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="10 digit phone number" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-white-50 small font-monospace">EMAIL ADDRESS</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="example@domain.com" required>
                    </div>

                    <div class="col-md-12">
                        <label for="address" class="form-label text-white-50 small font-monospace">RESIDENTIAL ADDRESS</label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter full address" required></textarea>
                    </div>

                    <div class="col-md-12 mt-4 d-flex gap-3 justify-content-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-light rounded-pill px-4 border-opacity-20">Cancel</a>
                        <button type="submit" class="btn btn-gradient px-4"><i class="bi bi-check-circle me-1"></i> Submit Student Record</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function confirmLogout() {
            return confirm("Are you sure you want to log out?");
        }
    </script>
</body>
</html>

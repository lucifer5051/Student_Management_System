<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Fee Payment</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8f9fa}</style></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SMS Admin Portal</a><a class="btn btn-outline-light btn-sm" href="{% url 'view_fees' %}">View Fee Records</a></div></nav><div class="container my-5"><div class="card shadow p-4"><h3 class="text-primary mb-4">Add Student Fee Payment</h3>{% if messages %}{% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endif %}<form method="POST">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Student</label><select name="student" class="form-select" required><option value="">Select Student</option>{% for student in students %}<option value="{{ student.id }}">{{ student.roll_number }} - {{ student.first_name }} {{ student.last_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Fee Amount</label><input type="number" step="0.01" name="amount" class="form-control" placeholder="Enter amount" required></div><div class="col-md-4"><label class="form-label">Payment Date</label><input type="date" name="payment_date" class="form-control" required></div><div class="col-md-4"><label class="form-label">Payment Method</label><select name="payment_method" class="form-select" required><option value="">Select Method</option><option value="Cash">Cash</option><option value="Online">Online</option><option value="Cheque">Cheque</option></select></div><div class="col-md-4"><label class="form-label">Payment Status</label><select name="status" class="form-select" required><option value="Paid">Paid</option><option value="Pending">Pending</option></select></div><div class="col-12"><button class="btn btn-success px-4" type="submit">Save Fee Payment</button><a class="btn btn-secondary px-4" href="{% url 'dashboard' %}">Cancel</a></div></div></form></div></div></body></html>
